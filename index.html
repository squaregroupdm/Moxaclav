<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Battle of Interns (demo)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Battle of Interns. Layout: one centred column (560px) for the quiz flow, a wider
   column (1100px) for admin. Clinical, quiet surfaces; one accent for actions. */
:root {
  --bg: #e4f3fb;
  --surface: #ffffff;
  --surface-2: #eaf2f8;
  --art: #7cc6e3;
  --art-2: #1c5f8f;
  --fg: #132238;
  --muted: #5d6b80;
  --line: #d3e0ea;
  --primary: #0f4c75;
  --primary-ink: #ffffff;
  --accent: #1b9aaa;
  --accent-soft: #dff4f6;
  --good: #1b7f4b;
  --good-soft: #e3f4ea;
  --warn: #b26a00;
  --warn-soft: #fff1d6;
  --bad: #b42323;
  --bad-soft: #fde8e8;
  --shadow: 0 1px 2px rgba(19, 34, 56, 0.06), 0 8px 24px rgba(19, 34, 56, 0.06);
  --font-display: "Sora", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1a26; --surface: #172131; --surface-2: #1f2b3d; --fg: #e7edf5; --muted: #9aa8bc; --art: #27516d; --art-2: #4fa3cf;
    --line: #2a3850; --primary: #3f8fc4; --primary-ink: #ffffff; --accent: #4fc3cf; --accent-soft: #15353b;
    --good: #4ccb86; --good-soft: #163626; --warn: #f0b24a; --warn-soft: #3a2a0d; --bad: #f08080; --bad-soft: #3d1a1a;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1a26; --surface: #172131; --surface-2: #1f2b3d; --fg: #e7edf5; --muted: #9aa8bc; --art: #27516d; --art-2: #4fa3cf;
  --line: #2a3850; --primary: #3f8fc4; --primary-ink: #ffffff; --accent: #4fc3cf; --accent-soft: #15353b;
  --good: #4ccb86; --good-soft: #163626; --warn: #f0b24a; --warn-soft: #3a2a0d; --bad: #f08080; --bad-soft: #3d1a1a;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { font-family: var(--font-display); line-height: 1.2; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 1.75rem; font-weight: 700; }
h2 { font-size: 1.25rem; font-weight: 600; }
h3 { font-size: 1rem; font-weight: 600; }
p { margin: 0; }
a { color: var(--primary); }
button { font: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 0.875rem; }
.eyebrow { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; color: var(--muted); }

/* Background art: original line-art microbes and capsules, drifting slowly */
body.admin .bgart { opacity: .4; }
.bgart { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; color: var(--art); }
.bgart > svg:first-child { width: 100%; height: 100%; display: block; }
.bgart .floater { position: absolute; width: 120px; height: 120px; opacity: .5; }
.bgart .f1 { left: 4%; top: 14%; }
.bgart .f2 { right: 3%; top: 32%; width: 150px; height: 100px; }
.bgart .f3 { left: 62%; top: 80%; width: 110px; height: 90px; }
.bgart .drift1 { animation: drift1 70s linear infinite; }
.bgart .drift2 { animation: drift2 110s linear infinite; transform-origin: 50% 50%; }
@keyframes drift1 { to { transform: translate(-260px, -260px); } }
@keyframes drift2 { from { transform: rotate(14deg) translate(0, 0); } to { transform: rotate(14deg) translate(442px, -442px); } }
.bgart .floater { animation: bob 9s ease-in-out infinite alternate; transform-origin: center; }
.bgart .floater.f2 { animation-duration: 13s; animation-delay: -4s; }
.bgart .floater.f3 { animation-duration: 11s; animation-delay: -7s; }
@keyframes bob { from { transform: translate(0, 0) rotate(-4deg); } to { transform: translate(14px, -22px) rotate(5deg); } }
@media (prefers-reduced-motion: reduce) { .bgart .drift1, .bgart .drift2, .bgart .floater { animation: none; } }
.topbar, .wrap, .footer, .toast, .modal-bg { position: relative; z-index: 1; }
.toast, .modal-bg { z-index: 50; }
.toast { position: fixed; }
.modal-bg { position: fixed; }

/* Shell */
.topbar {
  position: sticky;
  z-index: 5;
  background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.topbar-in {
  max-width: 1100px; margin: 0 auto; padding: 12px 16px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.brand { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.brand-name { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; letter-spacing: -0.01em; }
.brand-sub { font-size: 0.72rem; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
.topbar .pill { flex-shrink: 0; }
.wrap { max-width: 560px; margin: 0 auto; padding-block: 24px 48px; padding-inline: 16px; }
.wrap.wide { max-width: 1100px; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.stack-sm { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.row.end { justify-content: flex-end; }
.grow { flex: 1 1 auto; min-width: 0; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); }
.card.flat { box-shadow: none; }
.card.tint { background: var(--accent-soft); border-color: transparent; box-shadow: none; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 12px 18px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); color: var(--fg); font-weight: 600; cursor: pointer;
  text-decoration: none; min-height: 44px; transition: background .15s, transform .05s;
}
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
.btn.primary:hover { filter: brightness(1.08); background: var(--primary); }
.btn.danger { color: var(--bad); border-color: var(--bad); background: transparent; }
.btn.danger:hover { background: var(--bad-soft); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.sm { padding: 7px 12px; min-height: 34px; font-size: 0.875rem; border-radius: 8px; }
.btn.block { width: 100%; }

/* Forms */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-weight: 600; font-size: 0.9rem; }
.field .hint { font-size: 0.8rem; color: var(--muted); }
.field .err { font-size: 0.8rem; color: var(--bad); }
.input, select.input, textarea.input {
  width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); color: var(--fg); font: inherit; min-height: 44px;
}
textarea.input { min-height: 88px; resize: vertical; }
.input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.field.invalid .input { border-color: var(--bad); }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 0.9rem; }
.check input { width: 18px; height: 18px; margin-top: 3px; flex-shrink: 0; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 640px) { .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr 1fr; } .grid-2 { grid-template-columns: 1fr; } .card { padding: 16px; } }

/* Pills and alerts */
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 0.78rem; font-weight: 600; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.accent { background: var(--accent-soft); color: var(--primary); }
.alert { padding: 12px 14px; border-radius: 10px; font-size: 0.9rem; border: 1px solid transparent; }
.alert.bad { background: var(--bad-soft); color: var(--bad); }
.alert.good { background: var(--good-soft); color: var(--good); }
.alert.warn { background: var(--warn-soft); color: var(--warn); }
.alert.info { background: var(--accent-soft); color: var(--fg); }

/* Welcome */
.hero { display: grid; grid-template-columns: 1fr 150px; gap: 16px; align-items: center; }
.hero-text { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.hero h1 { font-size: 2rem; }
.hero-art { width: 150px; max-width: 100%; color: var(--art-2); justify-self: end; }
.hero-art .acc { color: var(--accent); }
@media (max-width: 480px) { .hero { grid-template-columns: 1fr 104px; } .hero-art { width: 104px; } .hero h1 { font-size: 1.7rem; } }
.rules { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.rule { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow); }
.rule b { font-family: var(--font-display); font-size: 0.95rem; }
.rule p { font-size: 0.85rem; color: var(--muted); line-height: 1.4; }
.rule-ic { width: 44px; height: 44px; border-radius: 12px; background: var(--accent-soft); color: var(--primary); display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 1rem; }
.rule-ic svg { width: 24px; height: 24px; }
@media (max-width: 360px) { .rules { grid-template-columns: 1fr; } }

/* Quiz */
.quiz-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.timer { font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; letter-spacing: 0.02em; display: inline-flex; align-items: center; gap: 8px; }
.timer.warn { color: var(--warn); }
.timer.bad { color: var(--bad); }
.timer-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0.25; } }
@media (prefers-reduced-motion: reduce) { .timer-dot { animation: none; } }
.progress { height: 8px; border-radius: 999px; background: color-mix(in srgb, var(--surface) 70%, var(--line)); overflow: hidden; display: flex; }
.progress > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }
.progress > i.skip { background: var(--warn); opacity: .75; }
.progress-meta { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--muted); }
.qtext { font-size: 1.1rem; font-weight: 600; line-height: 1.45; }
.options { display: grid; gap: 10px; }
.opt {
  display: grid; grid-template-columns: 32px 1fr; gap: 12px; align-items: center; text-align: left;
  width: 100%; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line);
  background: var(--surface); color: var(--fg); cursor: pointer; font: inherit; line-height: 1.4;
}
.opt:hover { border-color: var(--accent); background: var(--accent-soft); }
.opt .key { width: 32px; height: 32px; border-radius: 8px; background: var(--surface-2); display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 0.85rem; }
.opt.selected { border-color: var(--primary); background: var(--accent-soft); }
.opt.selected .key { background: var(--primary); color: var(--primary-ink); }
.opt.correct { border-color: var(--good); background: var(--good-soft); }
.opt.correct .key { background: var(--good); color: #fff; }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .key { background: var(--bad); color: #fff; }
.opt[disabled] { cursor: default; }
.qnav { display: flex; gap: 10px; }
.qnav .btn { flex: 1; }

/* Result */
.score-tile { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; }
.score-big { font-family: var(--font-display); font-size: 3rem; font-weight: 700; line-height: 1; }
.score-big small { font-size: 1.1rem; color: var(--muted); font-weight: 600; }
.stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stat { background: var(--surface-2); border-radius: 10px; padding: 10px 4px; text-align: center; min-width: 0; }
.stat b { display: block; font-family: var(--font-display); font-size: 1.1rem; }
.stat span { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.review { display: grid; gap: 12px; }
.review-item { border-left: 3px solid var(--bad); padding-left: 14px; display: grid; gap: 8px; }
.review-item.ok { border-left-color: var(--good); }
.review-item .explain { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; font-size: 0.9rem; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
#addInst { flex-wrap: nowrap; }
.tab { padding: 10px 14px; border: 0; background: transparent; color: var(--muted); font-weight: 600; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tab.active { color: var(--primary); border-bottom-color: var(--primary); }

/* Leaderboard */
.board { display: grid; gap: 6px; }
.board-row { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); }
.board-row.me { border-color: var(--primary); background: var(--accent-soft); }
.board-row .rank { font-family: var(--font-display); font-weight: 700; color: var(--muted); }
.board-row.top .rank { color: var(--warn); }
.board-row .who { min-width: 0; }
.board-row .who b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.board-row .who span { font-size: 0.78rem; color: var(--muted); }
.board-row .sc { text-align: right; }
.board-row .sc b { font-family: var(--font-display); font-size: 1.1rem; display: block; }
.board-row .sc span { font-size: 0.75rem; color: var(--muted); }

/* Tables (admin) */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); background: var(--surface-2); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.actions { white-space: nowrap; }
.bar { height: 6px; background: var(--surface-2); border-radius: 999px; overflow: hidden; min-width: 80px; }
.bar > i { display: block; height: 100%; background: var(--good); }
.bar.low > i { background: var(--bad); }
.bar.mid > i { background: var(--warn); }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.kpi b { font-family: var(--font-display); font-size: 1.6rem; display: block; }
.kpi span { font-size: 0.78rem; color: var(--muted); }

/* Modal (in-page confirm) */
.modal-bg { position: fixed; inset: 0; background: rgba(10, 18, 30, 0.55); display: grid; place-items: center; z-index: 50; padding: 16px; }
.modal { background: var(--surface); border-radius: 16px; padding: 22px; max-width: 420px; width: 100%; box-shadow: var(--shadow); display: grid; gap: 14px; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 0.9rem; z-index: 60; max-width: calc(100% - 32px); }

.footer { text-align: center; font-size: 0.78rem; color: var(--muted); padding-top: 24px; }
.footer a { color: var(--muted); }
.demo-badge { font-size: 0.72rem; font-weight: 700; padding: 3px 8px; border-radius: 6px; background: var(--warn-soft); color: var(--warn); letter-spacing: .04em; }

/* ---------- Splash ---------- */
.splash { position: relative; min-height: calc(100vh - 0px); min-height: 100dvh; display: flex; flex-direction: column; color: var(--fg); }
.splash-bg { position: absolute; inset: 0; background-size: cover; background-position: center; z-index: 0; }
.splash-bg.has-image::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(8, 24, 40, 0.25) 0%, rgba(8, 24, 40, 0.62) 60%, rgba(8, 24, 40, 0.92) 100%); }
.splash.has-image { color: #ffffff; }
.splash-body { position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 48px 16px 24px; gap: 18px; }
.splash-kicker { font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600; opacity: 0.85; }
.splash h1 { font-size: clamp(2.4rem, 8vw, 4rem); letter-spacing: -0.02em; line-height: 1.05; max-width: 14ch; }
.splash-sub { max-width: 44ch; opacity: 0.9; font-size: 1.05rem; }
.splash .btn.hero-cta { padding: 16px 36px; font-size: 1.1rem; border-radius: 14px; }
.splash.has-image .btn.hero-cta { background: #ffffff; color: #0f4c75; border-color: #ffffff; }
.splash-login { font-size: 0.95rem; opacity: 0.9; }
.splash-login a { color: inherit; font-weight: 600; }
.splash-art { width: min(220px, 50vw); color: var(--art-2); }
.splash-art .hero-art { width: 100%; }
.hero-icon { object-fit: contain; aspect-ratio: 1; }
.splash.has-image .splash-art { color: #ffffff; opacity: 0.9; }
.splash-foot { position: relative; z-index: 1; padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px)); font-size: 0.78rem; opacity: 0.85; display: grid; gap: 10px; max-width: 760px; margin: 0 auto; width: 100%; }
.splash-foot ol { margin: 0; padding-left: 18px; display: grid; gap: 3px; }
.splash-foot a { color: inherit; font-weight: 600; }
.splash-foot .foot-row { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-top: 1px solid currentColor; padding-top: 10px; opacity: 0.9; }

/* ---------- Banners ---------- */
.banner-top { position: relative; z-index: 1; max-width: 1100px; margin: 12px auto 0; padding-inline: 16px; }
.banner-top img { display: block; width: 100%; height: auto; border-radius: 12px; box-shadow: var(--shadow); }
.popup-bg { position: fixed; inset: 0; background: rgba(8, 18, 30, 0.7); z-index: 70; display: grid; place-items: center; padding: 16px; }
.popup { position: relative; max-width: 560px; width: 100%; }
.popup img { display: block; width: 100%; height: auto; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.45); }
.popup-close { position: absolute; top: -12px; right: -12px; width: 40px; height: 40px; border-radius: 50%; border: 0; background: #ffffff; color: #132238; font-size: 1.3rem; font-weight: 700; cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,.35); display: grid; place-items: center; }
.popup-timer { position: absolute; left: 12px; bottom: 12px; font-size: 0.72rem; background: rgba(0,0,0,.55); color: #fff; padding: 3px 8px; border-radius: 999px; }

/* ---------- Home / dashboard ---------- */
.home-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.home-head h1 { font-size: 1.6rem; }
.quiz-card { display: grid; gap: 14px; }
.quiz-card .state { display: flex; align-items: center; gap: 10px; }
.state-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
.state-dot.open { background: var(--good); box-shadow: 0 0 0 4px var(--good-soft); }
.state-dot.scheduled { background: var(--warn); }
.state-dot.closed { background: var(--bad); }
.countdown { display: flex; gap: 8px; }
.countdown .cd { background: var(--surface-2); border-radius: 10px; padding: 8px 10px; min-width: 62px; text-align: center; }
.countdown .cd b { display: block; font-family: var(--font-display); font-size: 1.4rem; line-height: 1.1; }
.countdown .cd span { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.materials { display: grid; gap: 10px; }
.material { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); text-decoration: none; color: inherit; }
.material:hover { border-color: var(--accent); }
.material .ic { width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 0.7rem; letter-spacing: 0.04em; background: var(--accent-soft); color: var(--primary); }
.material .ic.pdf { background: var(--bad-soft); color: var(--bad); }
.material .ic.xlsx, .material .ic.xls { background: var(--good-soft); color: var(--good); }
.material .t { min-width: 0; }
.material .t b { display: block; font-size: 0.95rem; line-height: 1.3; }
.material .t span { font-size: 0.8rem; color: var(--muted); display: block; }
.material .go { font-size: 0.8rem; color: var(--primary); font-weight: 600; white-space: nowrap; }
.terms-body { white-space: pre-line; font-size: 0.92rem; line-height: 1.55; }
.pw-wrap { position: relative; }
.pw-wrap .input { padding-right: 64px; }
.pw-toggle { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); border: 0; background: transparent; color: var(--primary); font-weight: 600; font-size: 0.8rem; cursor: pointer; padding: 6px; }
.img-preview { max-width: 100%; max-height: 160px; border-radius: 10px; border: 1px solid var(--line); display: block; }
.radio-row { display: flex; gap: 16px; flex-wrap: wrap; }
.radio-row label { display: flex; gap: 8px; align-items: center; font-size: 0.92rem; }
.drag-handle { cursor: grab; color: var(--muted); user-select: none; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.85em; }
.user-chip { display: flex; gap: 8px; align-items: center; flex-wrap: nowrap; flex-shrink: 0; }
@media (max-width: 480px) { .user-chip .pill { display: none; } }

/* Autocomplete */
.ac { position: relative; }
.ac-list { position: absolute; left: 0; right: 0; top: calc(100% - 22px); z-index: 20; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); max-height: 260px; overflow-y: auto; display: grid; }
.ac-item { text-align: left; border: 0; background: transparent; padding: 10px 12px; font: inherit; color: var(--fg); cursor: pointer; border-bottom: 1px solid var(--line); }
.ac-item:hover, .ac-item:focus { background: var(--accent-soft); }
.ac-note { padding: 8px 12px; font-size: 0.8rem; color: var(--muted); }
/* Big countdown */
.cd-hero { display: grid; gap: 12px; justify-items: center; text-align: center; padding-block: 6px; }
.cd-hero h2 { font-size: 1.5rem; }
.countdown.big { gap: 10px; flex-wrap: wrap; justify-content: center; }
.countdown.big .cd { min-width: 72px; padding: 12px 10px; background: var(--accent-soft); }
.countdown.big .cd b { font-size: 2.2rem; color: var(--primary); }
.countdown.muted-cd .cd b { color: var(--muted); }
@media (max-width: 400px) { .countdown.big .cd { min-width: 64px; } .countdown.big .cd b { font-size: 1.8rem; } }

</style>

<script>window.BOI_ASSET_BASE = "https://squaregroupdm.github.io/BattleofInterns/public/";window.BOI_SEED_QUESTIONS = [{"text": "Amoxicillin belongs to which WHO AWaRe group?", "options": {"A": "Watch", "B": "Access", "C": "Reserve", "D": "Not recommended"}, "correct": "B", "explanation": "Amoxicillin (penicillin, ATC J01CA04) is an Access antibiotic: wide activity against common pathogens with low resistance potential.\n\nReference: WHO AWaRe classification 2023 (WHO-MHP-HPS-EML-2023.04 xlsx), sheet 'AWaRe classification 2023'; Bangladesh STG on Antibiotic Use in Common Infectious Diseases, v1.0 (DGHS, 2021), Annex 2 (Access list).", "topic": "AWaRe classification"}, {"text": "Flucloxacillin is classified in which AWaRe group?", "options": {"A": "Access", "B": "Watch", "C": "Reserve", "D": "Not recommended"}, "correct": "A", "explanation": "Flucloxacillin is an Access penicillin, listed as a therapeutic alternative to cloxacillin.\n\nReference: WHO AWaRe classification 2023 (WHO-MHP-HPS-EML-2023.04 xlsx), sheet 'Access'; Bangladesh STG on Antibiotic Use in Common Infectious Diseases, v1.0 (DGHS, 2021), Annex 2 (Access list, no. 14).", "topic": "AWaRe classification"}, {"text": "Amoxicillin/clavulanic acid (co-amoxiclav) is best described as:", "options": {"A": "A penicillin in the Watch group", "B": "A cephalosporin in the Access group", "C": "A beta-lactam/beta-lactamase-inhibitor combination in the Reserve group", "D": "A beta-lactam/beta-lactamase-inhibitor combination in the Access group"}, "correct": "D", "explanation": "Co-amoxiclav (J01CR02) is a beta-lactam/beta-lactamase-inhibitor combination and is an Access antibiotic.\n\nReference: WHO AWaRe classification 2023 (WHO-MHP-HPS-EML-2023.04 xlsx), sheet 'AWaRe classification 2023'; Bangladesh STG on Antibiotic Use in Common Infectious Diseases, v1.0 (DGHS, 2021), Annex 2 (Access list, no. 3).", "topic": "AWaRe classification"}, {"text": "Which AWaRe group should be protected as 'last-resort' options for confirmed or suspected multidrug-resistant infections?", "options": {"A": "Access", "B": "Reserve", "C": "Watch", "D": "Not recommended"}, "correct": "B", "explanation": "Reserve antibiotics (e.g. linezolid, colistin, tigecycline) are kept for MDR organisms when alternatives have failed or are unsuitable.\n\nReference: WHO Practical Toolkit: AMS Programmes in Health-care Facilities in LMICs (2019), Figure 11 (Section 4.7); Bangladesh STG on Antibiotic Use in Common Infectious Diseases, v1.0 (DGHS, 2021), Annex 2.", "topic": "AWaRe classification"}, {"text": "Which is a brand name of Amoxicillin + Clavulanic Acid combination preparation?", "options": {"A": "Moxacil", "B": "Moxaclav", "C": "Phylopen", "D": "Cefotil Plus"}, "correct": "B", "explanation": "", "topic": "Brand Name"}, {"text": "In which of the following scenarios is Co-amoxiclav (Amoxicillin + Clavulanate) clinically preferred over Amoxicillin alone?", "options": {"A": "First-line therapy for mild community-acquired pneumonia without comorbidities", "B": "Empiric treatment of acute bacterial sinusitis when beta-lactamase producing pathogens (H. influenzae / M. catarrhalis) are suspected", "C": "Uncomplicated streptococcal pharyngitis", "D": "Prophylaxis for uncomplicated acute viral cough"}, "correct": "B", "explanation": "\n\nReference: WHO AWaRe Book 2022 (Chapter 7, p. 71): Addition of clavulanic acid restores activity against beta-lactamase producing organisms like H. influenzae and M. catarrhalis.", "topic": "Co-amoxiclav vs Amoxicillin"}, {"text": "Which antibacterial fixed-dose combination is scientifically justified and listed in the national and WHO Essential Medicines Lists?", "options": {"A": "Amoxicillin + clavulanic acid", "B": "Cefuroxime + clavulanic acid", "C": "Amoxicillin + flucloxacillin", "D": "Cefixime + linezolid"}, "correct": "A", "explanation": "The STG names amoxicillin-clavulanic acid as a justified FDC; cefuroxime-clavulanic acid is called unjustified polypharmacy.\n\nReference: Bangladesh STG on Antibiotic Use in Common Infectious Diseases, v1.0 (DGHS, 2021), Section 2.4; WHO AWaRe classification 2023 (WHO-MHP-HPS-EML-2023.04 xlsx), sheet 'Not recommended'.", "topic": "Rational use"}, {"text": "When selecting empiric therapy for acute bacterial rhinosinusitis where beta-lactamase producing pathogens (Haemophilus influenzae or Moraxella catarrhalis) are suspected, why is Amoxicillin-Clavulanate (Co-amoxiclav) clinically preferred over Amoxicillin alone?", "options": {"A": "The addition of clavulanic acid inhibits beta-lactamase enzymes, successfully restoring and broadening antibacterial activity against resistant strains.", "B": "Clavulanic acid acts as a potent antitussive agent that suppresses uncomplicated viral upper respiratory cough.", "C": "Co-amoxiclav belongs to the Reserve group, making it the required first-line agent for mild outpatient pharyngitis.", "D": "It completely eliminates the need for renal function dose adjustments in elderly patients."}, "correct": "A", "explanation": "The addition of clavulanic acid (a beta-lactamase inhibitor) protects amoxicillin from degradation by beta-lactamase-producing organisms, rendering it clinically effective against resistant respiratory pathogens like H. influenzae.\n\nReference: WHO AWaRe Antibiotic Book 2022 (Chapter 7, p. 71); Bangladesh STG on Antibiotic Use in Common Infectious Diseases, v1.0 (DGHS, 2021).", "topic": "Stewardship"}, {"text": "Why is it essential to instruct patients/caregivers to refrigerate oral reconstitutions of Co-amoxiclav (Amoxicillin + Clavulanic acid) suspension in warm tropical climates like Bangladesh?", "options": {"A": "Amoxicillin precipitates rapidly at room temperature", "B": "Clavulanic acid rapidly degrades at ambient temperatures", "C": "Refrigeration prevents gastric irritation", "D": "Refrigeration changes the color to signal active dose"}, "correct": "B", "explanation": "WHO AWaRe Book 2022 (p. 45, 61): Clavulanic acid is thermally unstable and rapidly metabolizes/degrades in high ambient temperatures.\n\nReference: National AMR Surveillance in Bangladesh 2016-2023, 'Antibiotic use' summary and Figure 58 (AWaRe distribution).", "topic": "Co-amoxiclav Storage"}, {"text": "What is the standard adult dose of linezolid (IV or oral) with normal renal function?", "options": {"A": "600 mg every 12 hours", "B": "300 mg every 12 hours", "C": "600 mg every 6 hours", "D": "1 g every 12 hours"}, "correct": "A", "explanation": "Adults receive linezolid 600 mg q12h by IV or oral route.\n\nReference: WHO AWaRe Antibiotic Book, Web Annex (Infographics), p.150 (Linezolid); Bangladesh STG on Antibiotic Use in Common Infectious Diseases, v1.0 (DGHS, 2021), Table 6.1 (Reserve: linezolid 600 mg IV 12 hourly).", "topic": "Dose - linezolid"}, {"text": "Which statement about linezolid dosing in renal impairment is correct?", "options": {"A": "Reduce the dose by 50% if CrCl is below 50 mL/min", "B": "No dose adjustment is needed", "C": "Give the same dose but only once daily", "D": "It is contraindicated in renal impairment"}, "correct": "B", "explanation": "Linezolid needs no renal dose adjustment, which is why it is an option in MRSA infection with severe renal impairment.\n\nReference: WHO AWaRe Antibiotic Book, Web Annex (Infographics), p.150 (Linezolid).", "topic": "Dose - linezolid"}, {"text": "Which statement about the route of administration of linezolid is correct?", "options": {"A": "It must be given IV for at least 7 days before oral switch", "B": "Oral absorption is poor so only IV is effective", "C": "Oral treatment can be started from the beginning because oral bioavailability is high", "D": "The oral form is only for children"}, "correct": "C", "explanation": "High oral bioavailability allows initiation with oral therapy as an alternative to IV (tablets 400/600 mg; IV 2 mg/mL).\n\nReference: WHO AWaRe Antibiotic Book, Web Annex (Infographics), p.150 (Linezolid).", "topic": "Dose - linezolid"}, {"text": "Why Penicillin manufacturers require dedicated Penicillin Manufacturing Unit?", "options": {"A": "To manufacture quality products", "B": "For better product appearance", "C": "To prevent cross contamination", "D": "A & C"}, "correct": "D", "explanation": "", "topic": "Moxaclav"}, {"text": "Which oral amoxicillin dose is listed for adults with mild-to-moderate community-acquired pneumonia in the WHO AWaRe book?", "options": {"A": "250 mg every 12 hours", "B": "500 mg once daily", "C": "2 g every 6 hours", "D": "1 g every 8 hours"}, "correct": "D", "explanation": "AWaRe book lists amoxicillin 1 g q8h orally for mild-to-moderate CAP (normal renal function).\n\nReference: WHO AWaRe Antibiotic Book, Web Annex (Infographics), Community-acquired pneumonia, pp.39-40.", "topic": "Dose - amoxicillin"}, {"text": "Pregnancy category of Amoxicillin + Clavulanic Acid is", "options": {"A": "A", "B": "B", "C": "C", "D": "X"}, "correct": "C", "explanation": "", "topic": "Moxaclav"}, {"text": "In the Bangladesh STG, what is the IV co-amoxiclav dose for severe adult pneumonia?", "options": {"A": "1.2 g IV every 8 hours", "B": "1.2 g IV every 24 hours", "C": "300 mg IV every 8 hours", "D": "2.4 g IV every 12 hours"}, "correct": "A", "explanation": "Severe CAP: co-amoxiclav 1.2 g IV 8-hourly plus clarithromycin 500 mg IV 12-hourly (AWaRe book: 1 g + 200 mg IV q8h).\n\nReference: Bangladesh STG on Antibiotic Use in Common Infectious Diseases, v1.0 (DGHS, 2021), Table 6.1 (Pneumonia, adult); WHO AWaRe Antibiotic Book, Web Annex (Infographics), CAP pp.39-42.", "topic": "Dose - co-amoxiclav"}, {"text": "What oral flucloxacillin dose does the Bangladesh STG recommend for superficial soft tissue infection/cellulitis in adults?", "options": {"A": "500 mg every 24 hours", "B": "2 g every 6 hours orally", "C": "250 mg every 12 hours", "D": "500 mg every 6 hours"}, "correct": "D", "explanation": "Flucloxacillin 500 mg orally 6-hourly (7 days), an Access, narrow-spectrum anti-staphylococcal choice.\n\nReference: Bangladesh STG on Antibiotic Use in Common Infectious Diseases, v1.0 (DGHS, 2021), Table 13.7 (Soft tissue infection/Cellulitis).", "topic": "Dose - flucloxacillin"}, {"text": "Which of the following conditions is the main clinical indication for prescribing oral or intravenous Flucloxacillin?", "options": {"A": "Suspected Staphylococcal skin and soft tissue infections (e.g., boils, impetigo, cellulitis)", "B": "Typhoid fever caused by Salmonella Typhi", "C": "Urinary tract infection caused by Escherichia coli", "D": "Cholera diarrhea"}, "correct": "A", "explanation": "\n\nReference: Bangladesh STG 2021 (p. 56, 59) & WHO AWaRe Book: Flucloxacillin is an isoxazolyl penicillin specifically targeted against Methicillin-Susceptible Staphylococcus aureus (MSSA).", "topic": "Flucloxacillin Indications"}, {"text": "A 40-year-old adult patient is prescribed oral Co-amoxiclav (Amoxicillin + Clavulanic Acid) for a moderate soft tissue infection. What is the standard adult oral dose and frequency?", "options": {"A": "250 mg once daily", "B": "625 mg (500/125 mg) 8-hourly Or 1 g (875/125 mg) 12-hourly", "C": "100 mg 6-hourly", "D": "2 g every 4 hours"}, "correct": "B", "explanation": "Bangladesh STG 2021 (p. 25, 59) & WHO AWaRe Guidelines: Standard adult oral Co-amoxiclav is 500/125 mg TDS (8-hourly) or 875/125 mg BD (12-hourly).\n\nReference: Bangladesh STG on Antibiotic Use in Common Infectious Diseases, v1.0 (DGHS, 2021), Table 8.1 (Acute Endocarditis).", "topic": "Co-amoxiclav Adult Dosing"}, {"text": "Which antibiotic is the preferred treatment for infected bite wounds, and why?", "options": {"A": "Amoxicillin alone, because it is cheapest", "B": "Flucloxacillin, because it covers anaerobes", "C": "Co-amoxiclav, because it covers anaerobes as well as skin flora", "D": "Linezolid, because it covers all bite pathogens"}, "correct": "C", "explanation": "Bite wounds involve oral anaerobes, so co-amoxiclav 500/125 mg q8h is preferred (flucloxacillin and amoxicillin alone lack full cover).\n\nReference: WHO AWaRe Antibiotic Book, Web Annex (Infographics), Wound and bite-related infections, pp.57-58.", "topic": "Clinical use"}, {"text": "For a mild, non-bite skin infection, which choice is preferred from a stewardship view over co-amoxiclav?", "options": {"A": "Ceftriaxone", "B": "Flucloxacillin (narrow-spectrum anti-staphylococcal penicillin)", "C": "Linezolid", "D": "Meropenem"}, "correct": "B", "explanation": "Cloxacillin/flucloxacillin (and cefalexin) have narrower spectra than co-amoxiclav and work well in mild SSTI, so they are preferred.\n\nReference: WHO AWaRe Antibiotic Book, Web Annex (Infographics), Wound infections pp.57-58 and SSTI pp.49-52; WHO AWaRe classification 2023 (WHO-MHP-HPS-EML-2023.04 xlsx), flucloxacillin = therapeutic alternative to cloxacillin.", "topic": "Stewardship"}, {"text": "Why is Clavulanic Acid combined with Amoxicillin in Co-amoxiclav preparations?", "options": {"A": "To reduce the renal excretion of amoxicillin", "B": "To inhibit beta-lactamase enzymes produced by bacteria, restoring amoxicillin's activity", "C": "To provide direct antifungal activity", "D": "To eliminate the need for refrigeration of oral suspensions"}, "correct": "B", "explanation": "WHO AWaRe Guidelines & Bangladesh STG 2021: Clavulanic acid is a beta-lactamase inhibitor that protects amoxicillin from degradation by beta-lactamase-producing organisms.", "topic": "Co-amoxiclav Indications"}, {"text": "Which is an appropriate use of linezolid?", "options": {"A": "Uncomplicated pharyngitis in an outpatient", "B": "Empirical treatment of simple cystitis", "C": "Gram-negative sepsis", "D": "MRSA infection in a patient with vancomycin hypersensitivity"}, "correct": "D", "explanation": "Targeted use: MRSA with severe renal impairment, vancomycin hypersensitivity, or need for oral therapy; VRE/VRSA; XDR-TB. Using it for simple OPD infections is irrational.\n\nReference: WHO AWaRe Antibiotic Book, Web Annex (Infographics), p.150 (Targeted treatment); National AMR Surveillance in Bangladesh 2016-2023, Reserve drug use in OPD (Table 14).", "topic": "Clinical use"}, {"text": "A ward patient was started on IV co-amoxiclav and is improving at 48-72 hours. What do stewardship principles advise?", "options": {"A": "Continue unchanged for 14 days", "B": "Review the therapy and switch IV to oral or narrow the spectrum if culture and clinical status allow", "C": "Stop all antibiotics automatically", "D": "Escalate to meropenem"}, "correct": "B", "explanation": "Hospital antibiotics should be reviewed at 48-72 hours, with early IV-to-oral switch and de-escalation.\n\nReference: WHO Practical Toolkit: AMS Programmes in Health-care Facilities in LMICs (2019), AMS competencies table (PDF p.71).", "topic": "Stewardship"}, {"text": "A 35-year-old male presents with severe dental abscess with facial swelling, trismus (inability to open mouth), and high fever (38.5°C). After performing surgical drainage/extraction, which oral antibiotic option is appropriate according to AWaRe guidelines?", "options": {"A": "Oral Ciprofloxacin", "B": "Oral Amoxicillin", "C": "Oral Linezolid", "D": "Oral Meropenem"}, "correct": "B", "explanation": "WHO AWaRe Book 2022 (Chapter 8, p. 93): For spreading dental infections with systemic features, Access group penicillins (Amoxicillin or Phenoxymethylpenicillin) are first-line adjuncts to surgical drainage.\n\nReference: Bangladesh STG on Antibiotic Use in Common Infectious Diseases, v1.0 (DGHS, 2021), Table 8.1; National AMR Surveillance in Bangladesh 2016-2023, Conclusions (MRSA 70%).", "topic": "Co-amoxiclav Dental Indications"}];window.BOI_SEED_INSTITUTIONS = ["Ad-din Akij Medical College & Hospital", "Ad-Din Medical College & Hospital", "Ad-Din Sakina Medical College & Hospital", "Aichi Hospital Ltd.", "Armed Forces Medical College", "Ashiyan Medical College & Hospital", "B.baria Medical College & Hospital", "Bangladesh Medical College Hospital. (BMCH)", "Barind Medical College & Hospi ical College & Hospital"];window.BOI_SEED_MATERIALS = [{"title": "WHO AWaRe Classification of Antibiotics 2023", "description": "Access, Watch, Reserve and Not recommended lists with ATC codes (Web Annex C of the WHO Essential Medicines List 2023).", "file": "WHO-AWaRe-Classification-2023.xlsx", "type": "xlsx", "size": 118671}, {"title": "WHO AWaRe Antibiotic Book: Guidelines on Antibiotic Use", "description": "Infographic annex with first and second choice antibiotics, doses and durations for common infections.", "file": "WHO-AWaRe-Antibiotic-Book-Infographics.pdf", "type": "pdf", "size": 6292010}, {"title": "WHO Practical Toolkit: Antimicrobial Stewardship Programmes", "description": "Setting up and running stewardship programmes in health-care facilities in low- and middle-income countries.", "file": "WHO-Antimicrobial-Stewardship-Practical-Toolkit.pdf", "type": "pdf", "size": 2268573}, {"title": "Standard Treatment Guidelines on Antibiotic Use in Common Infectious Diseases of Bangladesh", "description": "DGHS, version 1.0, December 2021. Adult and child regimens by condition, Annex 2 AWaRe lists.", "file": "STG-Antibiotic-Use-Bangladesh-2021.pdf", "type": "pdf", "size": 1439859}, {"title": "National Antimicrobial Resistance (AMR) Surveillance Report, Bangladesh 2016-2023", "description": "IEDCR report on resistance patterns and antibiotic-use trends across sentinel sites.", "file": "National-AMR-Surveillance-Report-Bangladesh-2016-2023.pdf", "type": "pdf", "size": 14111744}, {"title": "The selection and use of essential medicines 2023 (Web Annex C), WHO", "description": "WHO publication page for the 2023 Essential Medicines List annex that carries the AWaRe classification.", "url": "https://www.who.int/publications/i/item/WHO-MHP-HPS-EML-2023.04", "type": "link"}];</script>
<script>
/* Demo adapter: same functions as api-remote.js, but everything is kept in this browser's
   localStorage. Used only for the standalone demo page. Nothing is sent anywhere. */
window.BOI_API = (function () {
  "use strict";
  const KEY = "boi_demo_v4";
  const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
  const delay = (v) => new Promise((r) => setTimeout(() => r(v), 120));
  const fail = (m) => { throw new Error(m); };
  const norm = (s) => String(s || "").trim();
  const normBmdc = (s) => norm(s).toUpperCase().replace(/\s+/g, " ").slice(0, 40);

  const DEFAULT_TERMS = "1. Participation is open exclusively to medical doctors currently serving as interns in recognized medical colleges or hospitals in Bangladesh.\n2. Each participant can register and participate only once.\n3. The quiz must be completed within the stipulated time using a personal internet-enabled device.\n4. Winners will be selected based on scores and completion time. The organizer's decision will be final.\n5. The organizer reserves the right to disqualify participants for unfair practices and modify or cancel the campaign if necessary.";
  const defaultSettings = () => ({ campaignName: "Battle of Interns", sponsor: "Moxaclav", durationSec: 600, questionCount: 25, shuffle: true, leaderboardPublic: true, showExplanations: true, registrationOpen: true,
    quizMode: "manual", quizOpen: true, quizStartAt: null, quizEndAt: null,
    splashIcon: "", splashHeadline: "Battle of Interns", splashSub: "An online quiz on rational antimicrobial use for intern doctors of Bangladesh. World AMR Awareness Week, 18 to 24 November.",
    bannerTop: { enabled: false, image: "", link: "" }, bannerPopup: { enabled: false, image: "", link: "", seconds: 10 }, terms: DEFAULT_TERMS });
  const seedMaterials = () => (window.BOI_SEED_MATERIALS || []).map((m, i) => ({ id: "m" + (i + 1), title: m.title, description: m.description || "", url: m.url || ((window.BOI_ASSET_BASE || "") + "materials/" + m.file), type: m.type || "link", size: m.size || null, visible: true, createdAt: Date.now() }));

  function seed() {
    const questions = (window.BOI_SEED_QUESTIONS || []).map((q, i) => ({ id: "q" + (i + 1), text: q.text, options: q.options, correct: q.correct, explanation: q.explanation, active: true }));

    async adminResetAttempts(t) { const db = load(); adminCheck(db, t); db.attempts = []; save(db); return { ok: true }; },
  };
})();

  let settings = { campaignName: "Battle of Interns", sponsor: "Moxaclav", durationSec: 600, questionCount: 25, leaderboardPublic: true, showExplanations: true, registrationOpen: true, quiz: { state: "locked" }, splash: {}, banners: { top: {}, popup: {} }, terms: "", institutions: [] };

  function showTerms() {

  function shell(inner, { wide = false, right = "", banner = true } = {}) {

  function bindLogout() { const b = document.getElementById("btnLogout"); if (b) b.addEventListener("click", async () => { API.logout(token()); store.del("boi_token"); Home.me = null; location.hash = ""; route(); }); }

    },
    autocomplete(input, list, names) {
      const render = () => {
        const q = input.value.trim().toLowerCase();
        if (!q) { list.hidden = true; return; }
        const starts = names.filter((n) => n.toLowerCase().startsWith(q)); const contains = names.filter((n) => !n.toLowerCase().startsWith(q) && n.toLowerCase().includes(q));

    register(err) {

        </div>`, { banner: false });
      const form = document.getElementById("regForm"); if (!form) return;

      form.birthDay.addEventListener("input", preview); form.phone.addEventListener("input", preview);

      shell(`

          <div class="card quiz-card">${quizCard}</div>

            <div class="rule"><div class="rule-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21l4-4 4 4M12 3v14"/><path d="M5 8l7-5 7 5"/></svg></div><b>Winners</b><p>Highest score wins. Ties go to the faster completion time.</p></div>

    countdown(at) {
      const el = document.getElementById("countdown"); if (!el) return;
      const tick = () => {
        let s = Math.max(0, Math.floor((at - Date.now()) / 1000));
        const d = Math.floor(s / 86400); s -= d * 86400; const h = Math.floor(s / 3600); s -= h * 3600; const m = Math.floor(s / 60); s -= m * 60;
        el.innerHTML = `<div class="cd"><b class="num">${d}</b><span>day${d === 1 ? "" : "s"}</span></div><div class="cd"><b class="num">${pad(h)}</b><span>hours</span></div><div class="cd"><b class="num">${pad(m)}</b><span>min</span></div><div class="cd"><b class="num">${pad(s)}</b><span>sec</span></div>`;
        if (at - Date.now() <= 0) { Home.stopTimer(); route(); }
      };
      tick(); Home.timer = setInterval(tick, 1000);
    },
    popup() {
      const pb = settings.banners && settings.banners.popup;
      if (!pb || !pb.enabled || !pb.image || session.get("boi_popup_seen")) return;
      session.set("boi_popup_seen", "1");
      const secs = Math.max(3, Number(pb.seconds) || 10);
      const bg = document.createElement("div"); bg.className = "popup-bg";
      bg.innerHTML = `<div class="popup">${pb.link ? `<a href="${esc(pb.link)}" target="_blank" rel="noopener">` : ""}<img src="${esc(assetUrl(pb.image))}" alt="">${pb.link ? "</a>" : ""}<button class="popup-close" aria-label="Close">&times;</button><span class="popup-timer" id="popupTimer">Closes in ${secs}s</span></div>`;
      let left = secs; const close = () => { clearInterval(iv); bg.remove(); };
      const iv = setInterval(() => { left--; const t = document.getElementById("popupTimer"); if (t) t.textContent = `Closes in ${left}s`; if (left <= 0) close(); }, 1000);
      bg.querySelector(".popup-close").addEventListener("click", close);
      bg.addEventListener("click", (e) => { if (e.target === bg) close(); });
      document.body.appendChild(bg);
    },
  };

  /* ---------------- Quiz ---------------- */
  const Quiz = {
    attempt: null, answers: {}, queue: [], seen: new Set(), tabSwitches: 0, timerId: null, saveTimer: null, submitting: false,
    async start() {
      if (!token()) { location.hash = "login"; return; }
      Quiz.stopTimer(); Quiz.submitting = false;
      shell(`<div class="card stack"><p class="muted">Preparing your quiz...</p></div>`, { banner: false });
      try {
        const a = await API.startAttempt(token());
        Quiz.attempt = a; Quiz.answers = a.answers || {}; Quiz.tabSwitches = a.tabSwitches || 0;
        Quiz.queue = a.questions.map((q) => q.id).filter((id) => !(id in Quiz.answers)); Quiz.seen = new Set();
        if (Quiz.queue.length === 0 || Date.now() >= a.endsAt) return Quiz.submit(true);
        if (Object.keys(Quiz.answers).length === 0) toast("Your clock has started.");
        Quiz.renderQuestion(); Quiz.startTimer();
        document.addEventListener("visibilitychange", Quiz.onVis);
      } catch (e) {
        if (/already completed/i.test(e.message)) { location.hash = "result"; return; }
        shell(`<div class="card stack"><div class="alert warn">${esc(e.message)}</div><a class="btn" href="#">Back to home</a></div>`, { banner: false });
      }
    },
    onVis() { if (document.hidden && Quiz.attempt) { Quiz.tabSwitches++; Quiz.queueSave(); } },
    startTimer() { Quiz.stopTimer(); Quiz.timerId = setInterval(Quiz.tick, 250); Quiz.tick(); },
    stopTimer() { clearInterval(Quiz.timerId); Quiz.timerId = null; document.removeEventListener("visibilitychange", Quiz.onVis); },
    tick() {
      if (!Quiz.attempt) return;
      const left = Math.max(0, Math.ceil((Quiz.attempt.endsAt - Date.now()) / 1000));
      const el = document.getElementById("timer");
      if (el) { const t = document.getElementById("timeText"); if (t) t.textContent = mmss(left); el.classList.toggle("warn", left <= 120 && left > 30); el.classList.toggle("bad", left <= 30); }
      if (left <= 0 && !Quiz.submitting) Quiz.submit(true);
    },
    queueSave() { clearTimeout(Quiz.saveTimer); Quiz.saveTimer = setTimeout(() => { API.saveProgress(token(), { answers: Quiz.answers, tabSwitches: Quiz.tabSwitches }).catch(() => {}); }, 600); },
    renderQuestion() {
      const a = Quiz.attempt; const qs = a.questions; const total = qs.length;
      const qid = Quiz.queue[0]; const q = qs.find((x) => x.id === qid); const idx = qs.indexOf(q);
      const answered = Object.keys(Quiz.answers).length;
      const revisit = Quiz.seen.has(qid); Quiz.seen.add(qid);
      const skippedCount = Quiz.queue.filter((id) => Quiz.seen.has(id) && id !== qid).length;
      shell(`
        <div class="stack">
          <div class="quiz-head">
            <div><span class="eyebrow">Question ${idx + 1} of ${total}</span><br><span class="small muted num">${answered} answered &middot; ${skippedCount} skipped</span></div>
            <div class="timer num" id="timer" aria-live="off"><span class="timer-dot"></span><span id="timeText">${mmss(Math.max(0, Math.ceil((a.endsAt - Date.now()) / 1000)))}</span></div>
          </div>
          <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${answered}"><i style="width:${(answered / total) * 100}%"></i><i class="skip" style="width:${(skippedCount / total) * 100}%"></i></div>
          ${revisit ? `<div class="alert info">You skipped this one earlier. It is back for a second look.</div>` : ""}
          <div class="card stack">
            <p class="qtext">${esc(q.text)}</p>
            <div class="options" role="radiogroup" aria-label="Options">
              ${q.options.map((o) => `<button type="button" class="opt" role="radio" aria-checked="false" data-key="${esc(o.key)}"><span class="key">${esc(o.key)}</span><span>${esc(o.text)}</span></button>`).join("")}
            </div>
            <div class="qnav"><button class="btn" id="btnSkip" type="button">Skip for now</button><button class="btn primary" id="btnNext" type="button" disabled>Next</button></div>
          </div>
          <div class="row between"><span class="small muted">Answers lock when you press Next.</span><button class="btn ghost sm" id="btnFinish" type="button">Finish early</button></div>
        </div>`, { right: `<span class="pill accent num">${answered}/${total}</span>`, banner: false });
      let picked = null; const next = document.getElementById("btnNext");
      document.querySelectorAll(".opt").forEach((b) => b.addEventListener("click", () => { picked = b.dataset.key; document.querySelectorAll(".opt").forEach((x) => { x.classList.toggle("selected", x === b); x.setAttribute("aria-checked", x === b ? "true" : "false"); }); next.disabled = false; }));
      next.addEventListener("click", () => { if (!picked) return; Quiz.answers[qid] = picked; Quiz.queue.shift(); Quiz.queueSave(); Quiz.advance(); });
      document.getElementById("btnSkip").addEventListener("click", () => { if (Quiz.queue.length === 1) { toast("This is the last unanswered question."); return; } Quiz.queue.push(Quiz.queue.shift()); Quiz.advance(); });
      document.getElementById("btnFinish").addEventListener("click", async () => {
        const left = Quiz.queue.length;
        const ok = await confirmBox({ title: "Finish the quiz now?", body: left ? `${left} question${left > 1 ? "s are" : " is"} still unanswered and will count as wrong.` : "All questions answered. Submit your answers?", okText: "Submit", danger: !!left });
        if (ok) Quiz.submit(false);
      });
    },
    advance() { if (Quiz.queue.length === 0) return Quiz.submit(false); Quiz.renderQuestion(); },
    async submit(auto) {
      if (Quiz.submitting) return;
      Quiz.submitting = true; Quiz.stopTimer();
      shell(`<div class="card stack"><h2>${auto ? "Time is up." : "Submitting..."}</h2><p class="muted">Scoring your answers.</p></div>`, { banner: false });
      try { const r = await API.submitAttempt(token(), { answers: Quiz.answers, tabSwitches: Quiz.tabSwitches }); Quiz.attempt = null; Quiz.submitting = false; Quiz.showResult(r, auto); }
      catch (e) { Quiz.submitting = false; shell(`<div class="card stack"><div class="alert bad">${esc(e.message)}</div><button class="btn" onclick="location.reload()">Try again</button></div>`); }
    },
    async result() {
      if (!token()) { location.hash = "login"; return; }
      try { const r = await API.getResult(token()); if (!r.completed) { location.hash = ""; return; } Quiz.showResult(r, false); }
      catch (e) { shell(`<div class="alert bad">${esc(e.message)}</div>`); }
    },
    showResult(r, timedOut) {
      Quiz.stopTimer();
      const wrong = r.review.filter((x) => !x.isCorrect);
      const pct = Math.round((r.correct / r.total) * 100);
      const render = (tab) => {
        shell(`
          <div class="stack">
            ${timedOut ? `<div class="alert warn">Time ran out, so your answers were submitted automatically.</div>` : ""}
            <div class="card stack">
              <div class="row between"><span class="eyebrow">Your result</span><a class="btn sm" href="#">Home</a></div>
              <div class="score-tile">
                <div class="score-big num">${r.score}<small>/${r.total}</small></div>
                <div><h2>${esc(r.name)}</h2><p class="muted small">${r.rank ? `Rank <b class="num">#${r.rank}</b> of ${r.totalParticipants} so far` : ""} ${pct >= 80 ? '<span class="pill good">Top form</span>' : pct >= 50 ? '<span class="pill accent">Solid</span>' : '<span class="pill warn">Keep reading</span>'}</p></div>
              </div>
              <div class="stat-row num">
                <div class="stat"><b>${r.correct}</b><span>Correct</span></div><div class="stat"><b>${r.wrong}</b><span>Wrong</span></div><div class="stat"><b>${r.skipped}</b><span>Unanswered</span></div><div class="stat"><b>${mmss(r.timeTakenSec)}</b><span>Time</span></div>
              </div>
              <p class="small muted">Winners are selected by score first, then faster completion time. Rank may change as more doctors finish.</p>
            </div>
            ${r.showExplanations ? `<div class="tabs" role="tablist">
              <button class="tab ${tab === "wrong" ? "active" : ""}" data-t="wrong">Learn from mistakes (${wrong.length})</button>
              <button class="tab ${tab === "all" ? "active" : ""}" data-t="all">All ${r.total} questions</button>
              ${settings.leaderboardPublic ? `<button class="tab ${tab === "board" ? "active" : ""}" data-t="board">Ranking</button>` : ""}
            </div>
            <div id="tabBody">${tab === "board" ? `<div class="muted small">Loading ranking...</div>` : Quiz.reviewList(tab === "wrong" ? wrong : r.review)}</div>` : `<div class="card tint">Answer explanations will be released after the quiz closes.</div>${settings.leaderboardPublic ? `<a class="btn block" href="#board">View ranking board</a>` : ""}`}
          </div>`, { right: userChip() });
        bindLogout();
        document.querySelectorAll(".tab").forEach((b) => b.addEventListener("click", () => render(b.dataset.t)));
        if (tab === "board") Board.fill(document.getElementById("tabBody"));
      };
      render("wrong");
    },
    reviewList(items) {
      if (!items.length) return `<div class="card tint"><b>Perfect score.</b> Nothing to review.</div>`;
      return `<div class="review">${items.map((x) => `
        <div class="card flat review-item ${x.isCorrect ? "ok" : ""}">
          <div class="row between"><span class="eyebrow">Q${x.number}</span>${x.isCorrect ? '<span class="pill good">Correct</span>' : x.yourAnswer ? '<span class="pill bad">Wrong</span>' : '<span class="pill warn">Unanswered</span>'}</div>
          <p class="qtext" style="font-size:1rem">${esc(x.text)}</p>
          <div class="options">${x.options.map((o) => `<div class="opt ${o.key === x.correct ? "correct" : (o.key === x.yourAnswer ? "wrong" : "")}" style="cursor:default"><span class="key">${esc(o.key)}</span><span>${esc(o.text)}</span></div>`).join("")}</div>
          ${x.explanation ? `<div class="explain"><b>Why:</b> ${esc(x.explanation).replace(/\n/g, "<br>")}</div>` : ""}
        </div>`).join("")}</div>`;
    },
  };

      const bg = modal(`<h2>Import questions</h2>

      let parsed = null;
      bg.querySelector("#impFile").addEventListener("change", (e) => {
        const f = e.target.files[0]; if (!f) return;
        const rd = new FileReader();
        rd.onload = () => {
          try { parsed = f.name.toLowerCase().endsWith(".json") ? JSON.parse(rd.result) : Admin.parseCsv(rd.result); }
          catch (ex) { parsed = null; bg.querySelector("#impStatus").textContent = "Could not read file: " + ex.message; return; }
          const bad = parsed.filter((q) => !q.text || !q.options || !["A", "B", "C", "D"].every((k) => q.options[k]) || !/^[ABCD]$/.test(q.correct));
          bg.querySelector("#impStatus").textContent = `${parsed.length} questions found${bad.length ? `, ${bad.length} invalid rows will be skipped` : ""}.`;

    },
    parseCsv(text) {
      const rows = []; let row = [], cell = "", inQ = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (inQ) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else inQ = false; } else cell += c; }
        else if (c === '"') inQ = true;
        else if (c === ",") { row.push(cell); cell = ""; }
        else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
        else cell += c;
      }
      if (cell || row.length) { row.push(cell); rows.push(row); }
      const head = rows.shift().map((h) => h.trim().toLowerCase());
      const col = (r, name) => r[head.indexOf(name)] ?? "";
      return rows.filter((r) => r.some((x) => x.trim())).map((r) => ({ text: col(r, "question").trim(), options: { A: col(r, "option_a").trim(), B: col(r, "option_b").trim(), C: col(r, "option_c").trim(), D: col(r, "option_d").trim() }, correct: col(r, "correct").trim().toUpperCase(), explanation: col(r, "explanation").trim() }));
    },

        await Admin.guard(() => API.adminSaveSettings(Admin.token, { splashHeadline: g("sp_head").value.trim(), splashSub: g("sp_sub").value.trim(), splashIcon: g("sp_img").value, bannerTop: { enabled: g("bt_on").checked, image: g("bt_img").value, link: g("bt_link").value.trim() }, bannerPopup: { enabled: g("bp_on").checked, image: g("bp_img").value, link: g("bp_link").value.trim(), seconds: Number(g("bp_sec").value) || 10 } }));
        await Admin.refreshSettings(); toast("Appearance saved"); Admin.appearance(el);
      });
    },

    async smsbase(el) {
      const st = await Admin.guard(() => API.adminSmsBaseStats(Admin.token));
      el.innerHTML = `<div class="stack">
        <div class="grid-4">
          <div class="kpi"><b class="num">${st.total}</b><span>Numbers in SMS base</span></div>
          <div class="kpi"><b class="num">${st.registered}</b><span>Registered from base ${st.total ? `(${Math.round((st.registered / st.total) * 100)}%)` : ""}</span></div>
          <div class="kpi"><b class="num">${st.completed}</b><span>Completed from base</span></div>
          <div class="kpi"><b class="num">${st.outsideBase}</b><span>Registered outside base</span></div>
        </div>
        <div class="card stack"><h2>Upload the SMS base</h2>
          <p class="small muted">Upload the same list you send SMS to: an Excel (.xlsx), CSV or text file with one mobile number per row (any column named phone/mobile/number, or the first column). Numbers are stored as 11 digits (01XXXXXXXXX); +88 and spaces are removed automatically. Duplicates are ignored.</p>
          <div class="row"><input type="file" class="input" id="sbFile" accept=".xlsx,.xls,.csv,.txt" style="max-width:360px"><label class="check"><input type="checkbox" id="sbReplace"><span>Replace the existing base</span></label><button class="btn primary" id="sbGo" disabled>Upload</button></div>
          <div id="sbStatus" class="small muted"></div>
        </div>
        <div class="card stack"><h2>Reports</h2>
          <p class="small muted">The match report lists every number in the SMS base with whether it registered, completed, its score and rank, followed by any participants who registered from numbers outside the base. Open it in Excel and filter.</p>
          <div class="row"><button class="btn" id="sbExport">Export SMS base match report (CSV)</button><button class="btn danger" id="sbClear" ${st.total ? "" : "disabled"}>Clear base</button></div>
        </div></div>`;
      let phones = null;
      el.querySelector("#sbFile").addEventListener("change", async (e) => {
        const f = e.target.files[0]; if (!f) return; const status = el.querySelector("#sbStatus"); status.textContent = "Reading file...";
        try { phones = await Admin.readPhoneFile(f); status.textContent = `${phones.length} numbers found in ${f.name}.`; el.querySelector("#sbGo").disabled = !phones.length; }
        catch (ex) { status.textContent = "Could not read the file: " + ex.message; phones = null; }
      });
      el.querySelector("#sbGo").addEventListener("click", async () => {
        const b = el.querySelector("#sbGo"); b.disabled = true; b.textContent = "Uploading...";
        try { let added = 0, invalid = 0, total = 0; const replace = el.querySelector("#sbReplace").checked; for (let i = 0; i < phones.length; i += 2000) { const r = await API.adminSmsBaseUpload(Admin.token, phones.slice(i, i + 2000), replace && i === 0); added += r.added; invalid += r.invalid; total = r.total; } toast(`${added} numbers added${invalid ? `, ${invalid} invalid skipped` : ""}. Base now ${total}.`); Admin.smsbase(el); }
        catch (ex) { toast(ex.message); b.disabled = false; b.textContent = "Upload"; }
      });
      el.querySelector("#sbExport").addEventListener("click", async () => { const r = await Admin.guard(() => API.adminExport(Admin.token, "smsmatch")); Admin.download(r.filename, r.csv, "text/csv"); });
      el.querySelector("#sbClear").addEventListener("click", async () => { if (await confirmBox({ title: "Clear the SMS base?", body: "Participants are not affected; only the comparison list is removed.", okText: "Clear", danger: true })) { await Admin.guard(() => API.adminSmsBaseClear(Admin.token)); toast("Cleared"); Admin.smsbase(el); } });
    },
    async readPhoneFile(f) {
      const name = f.name.toLowerCase();
      const pick = (rows) => {
        if (!rows.length) return [];
        let col = 0; const head = rows[0].map((h) => String(h ?? "").toLowerCase());
        const hi = head.findIndex((h) => /phone|mobile|number|msisdn|cell/.test(h)); if (hi >= 0) { col = hi; rows = rows.slice(1); }
        return rows.map((r) => String(r[col] ?? "").trim()).filter(Boolean);
      };
      if (name.endsWith(".xlsx") || name.endsWith(".xls")) {
        if (!window.XLSX) await new Promise((res, rej) => { const sc = document.createElement("script"); sc.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"; sc.onload = res; sc.onerror = () => rej(new Error("Could not load the Excel reader. Save the file as CSV and try again.")); document.head.appendChild(sc); });
        const buf = await f.arrayBuffer(); const wb = window.XLSX.read(buf, { type: "array" }); const ws = wb.Sheets[wb.SheetNames[0]];
        return pick(window.XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: "" }));
      }
      const text = await f.text(); const rows = text.split(/\r?\n/).map((l) => l.split(/[,\t;]/));
      return pick(rows);
    },

    async colleges(el, q = "") {
      const list = await Admin.guard(() => API.adminInstitutions(Admin.token));
      const shown = list.filter((n) => !q || n.toLowerCase().includes(q.toLowerCase()));
      el.innerHTML = `<div class="stack">
        <div class="row between"><div><h2>${list.length} medical colleges</h2><span class="small muted">These appear in the registration drop-down, alphabetically. Doctors can also choose "Other" and type a name.</span></div>
          <form class="row" id="addInst"><input class="input" id="instNew" placeholder="Add a college, e.g. Thakurgaon Medical College, Thakurgaon" style="min-width:300px" required><button class="btn sm primary" type="submit">Add</button></form></div>
        <div class="row between"><input class="input" id="instSearch" placeholder="Filter list" value="${esc(q)}" style="max-width:280px"><button class="btn sm" id="instReset">Restore default list</button></div>
        <div class="table-wrap"><table><thead><tr><th>#</th><th>Medical college</th><th></th></tr></thead><tbody>
          ${shown.map((n, i) => `<tr><td class="num">${i + 1}</td><td>${esc(n)}</td><td class="actions"><button class="btn sm danger" data-rm="${esc(n)}">Remove</button></td></tr>`).join("") || `<tr><td colspan="3" class="muted">No match.</td></tr>`}
        </tbody></table></div></div>`;
      const save = async (next) => { await Admin.guard(() => API.adminSaveInstitutions(Admin.token, next)); await Admin.refreshSettings(); Admin.colleges(el, document.getElementById("instSearch").value); };
      document.getElementById("addInst").addEventListener("submit", async (e) => { e.preventDefault(); const v = document.getElementById("instNew").value.trim(); if (!v) return; if (list.some((n) => n.toLowerCase() === v.toLowerCase())) { toast("Already in the list"); return; } await save([...list, v]); toast("Added"); });
      let st; document.getElementById("instSearch").addEventListener("input", (e) => { clearTimeout(st); st = setTimeout(() => Admin.colleges(el, e.target.value), 250); });
      el.querySelectorAll("[data-rm]").forEach((b) => b.addEventListener("click", async () => { if (await confirmBox({ title: "Remove this college?", body: b.dataset.rm + " will no longer appear in the drop-down. Existing registrations keep their value.", okText: "Remove", danger: true })) { await save(list.filter((n) => n !== b.dataset.rm)); toast("Removed"); } }));
      document.getElementById("instReset").addEventListener("click", async () => { if (await confirmBox({ title: "Restore the default list?", body: "Your additions and removals will be replaced by the built-in list of 112 colleges.", okText: "Restore" })) { await save(null); toast("Default list restored"); } });
    },

    async settings(el) {
      const s = await Admin.guard(() => API.adminSettings(Admin.token));
      const toLocal = (ms) => { if (!ms) return ""; const d = new Date(ms); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; };
      el.innerHTML = `<div class="stack">
        <form class="card stack" id="accForm"><h2>Quiz access</h2>
          <div class="radio-row"><label><input type="radio" name="qmode" value="manual" ${s.quizMode !== "scheduled" ? "checked" : ""}> Manual: I open and close the quiz myself</label><label><input type="radio" name="qmode" value="scheduled" ${s.quizMode === "scheduled" ? "checked" : ""}> Scheduled: opens and closes at set times</label></div>
          <div id="qManual" ${s.quizMode === "scheduled" ? "hidden" : ""}><label class="check"><input type="checkbox" id="q_open" ${s.quizOpen ? "checked" : ""}><span>The quiz is open now (participants can press Start)</span></label></div>
          <div id="qSched" class="grid-2" ${s.quizMode === "scheduled" ? "" : "hidden"}>
            <div class="field"><label for="q_start">Opens at</label><input class="input" id="q_start" type="datetime-local" value="${toLocal(s.quizStartAt)}"><span class="hint">Participants see a live countdown to this moment.</span></div>
            <div class="field"><label for="q_end">Closes at</label><input class="input" id="q_end" type="datetime-local" value="${toLocal(s.quizEndAt)}"><span class="hint">Leave blank to keep it open until you close it.</span></div>
          </div>
          <label class="check"><input type="checkbox" id="s_reg" ${s.registrationOpen !== false ? "checked" : ""}><span>Registration is open (new doctors can create accounts)</span></label>
          <label class="check"><input type="checkbox" id="s_board" ${s.leaderboardPublic ? "checked" : ""}><span>Ranking board visible to participants</span></label>
          <label class="check"><input type="checkbox" id="s_expl" ${s.showExplanations !== false ? "checked" : ""}><span>Show correct answers and explanations to a doctor right after they submit (switch off until the quiz closes if you want to prevent answer sharing)</span></label>
          <div class="row end"><button class="btn primary" type="submit">Save access settings</button></div>
        </form>
        <form class="card stack" id="setForm"><h2>Quiz settings</h2>
          <div class="grid-2">
            <div class="field"><label for="s_name">Campaign name</label><input class="input" id="s_name" value="${esc(s.campaignName)}"></div>
            <div class="field"><label for="s_sponsor">Brand line</label><input class="input" id="s_sponsor" value="${esc(s.sponsor)}"></div>
            <div class="field"><label for="s_dur">Duration (minutes)</label><input class="input" id="s_dur" type="number" min="1" max="120" value="${Math.round(s.durationSec / 60)}"></div>
            <div class="field"><label for="s_count">Questions per attempt</label><input class="input" id="s_count" type="number" min="1" max="200" value="${s.questionCount}"><span class="hint">If fewer active questions exist, all of them are used.</span></div>
          </div>
          <label class="check"><input type="checkbox" id="s_shuffle" ${s.shuffle ? "checked" : ""}><span>Shuffle question order for every participant</span></label>
          <div class="field"><label for="s_terms">Terms and conditions (one point per line)</label><textarea class="input" id="s_terms" style="min-height:160px">${esc(s.terms || "")}</textarea></div>
          <div class="row end"><button class="btn primary" type="submit">Save settings</button></div>
        </form>
        <form class="card stack" id="pwForm"><h2>Admin password</h2>
          <div class="grid-2"><div class="field"><label for="pw_old">Current password</label><input class="input" type="password" id="pw_old" required></div><div class="field"><label for="pw_new">New password</label><input class="input" type="password" id="pw_new" minlength="8" required></div></div>
          <div class="row end"><button class="btn" type="submit">Change password</button></div></form>
        <div class="card stack"><h2>Danger zone</h2><p class="muted small">Use before going live to clear test entries. Questions, materials and settings stay.</p><div class="row"><button class="btn danger" id="btnResetAttempts">Clear all quiz attempts (keep accounts)</button><button class="btn danger" id="btnReset">Delete all participants</button></div></div>
      </div>`;
      el.querySelectorAll("[name=qmode]").forEach((r) => r.addEventListener("change", () => { const v = el.querySelector("[name=qmode]:checked").value; el.querySelector("#qManual").hidden = v !== "manual"; el.querySelector("#qSched").hidden = v !== "scheduled"; }));
      const g = (id) => el.querySelector("#" + id);
      document.getElementById("accForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const mode = el.querySelector("[name=qmode]:checked").value;
        await Admin.guard(() => API.adminSaveSettings(Admin.token, { quizMode: mode, quizOpen: g("q_open").checked, quizStartAt: g("q_start").value ? new Date(g("q_start").value).getTime() : null, quizEndAt: g("q_end").value ? new Date(g("q_end").value).getTime() : null, registrationOpen: g("s_reg").checked, leaderboardPublic: g("s_board").checked, showExplanations: g("s_expl").checked }));
        await Admin.refreshSettings(); toast("Access settings saved"); Admin.settings(el);
      });
      document.getElementById("setForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        await Admin.guard(() => API.adminSaveSettings(Admin.token, { campaignName: g("s_name").value.trim() || "Battle of Interns", sponsor: g("s_sponsor").value.trim(), durationSec: Math.max(60, Number(g("s_dur").value) * 60), questionCount: Math.max(1, Number(g("s_count").value)), shuffle: g("s_shuffle").checked, terms: g("s_terms").value.trim() }));
        await Admin.refreshSettings(); toast("Settings saved"); Admin.settings(el);
      });
      document.getElementById("pwForm").addEventListener("submit", async (e) => { e.preventDefault(); await Admin.guard(() => API.adminChangePassword(Admin.token, g("pw_old").value, g("pw_new").value)); toast("Password changed"); e.target.reset(); });
      document.getElementById("btnResetAttempts").addEventListener("click", async () => { if (await confirmBox({ title: "Clear all quiz attempts?", body: "Every score is deleted; accounts stay and everyone can take the quiz again.", okText: "Clear attempts", danger: true })) { await Admin.guard(() => API.adminResetAttempts(Admin.token)); toast("Attempts cleared"); } });
      document.getElementById("btnReset").addEventListener("click", async () => { if (await confirmBox({ title: "Delete all participants?", body: "Accounts, answers and rankings are deleted. This cannot be undone. Export first if you need the data.", okText: "Delete everything", danger: true })) { await Admin.guard(() => API.adminReset(Admin.token)); store.del("boi_token"); toast("Participants deleted"); Admin.tab = "overview"; Admin.render(); } });
    },

    async download(filename, text, type) {
      try { if (window.claude && window.claude.use) { const dl = await window.claude.use("downloads"); if (dl) { await dl.save({ filename, data: new Blob([text], { type }) }); return; } } } catch (e) { /* viewer declined; fall through */ }
      const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    },
  };


  route();
})();

</script>
</body>
</html>
